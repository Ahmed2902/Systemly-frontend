name: Apply approved Arabic terminology

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - scripts/apply-approved-arabic-terms.mjs
      - .github/workflows/apply-approved-arabic-terms.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-approved-arabic-terms.mjs
      - name: Commit product terminology and remove one-time workflow
        run: |
          rm -f scripts/apply-approved-arabic-terms.mjs
          rm -f .github/workflows/apply-approved-arabic-terms.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align Arabic copy with approved product terminology" || exit 0
          git push origin HEAD:${{ github.head_ref }}
