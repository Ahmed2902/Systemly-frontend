name: Apply platform localization codemod

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - scripts/migrate-platform-localization.mjs
      - .github/workflows/apply-platform-localization.yml

permissions:
  contents: write

concurrency:
  group: platform-localization-codemod
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate explicit platform copy
        run: node scripts/migrate-platform-localization.mjs

      - name: Commit generated migration
        run: |
          if git diff --quiet; then
            echo "No localization changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "refactor: migrate platform copy to explicit translations"
          git push origin HEAD:${{ github.head_ref }}
