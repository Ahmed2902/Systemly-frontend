name: Production localization gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/production-localization-gate.yml
      - src/**
      - scripts/check-platform-localization-v2.mjs
      - package.json
      - package-lock.json

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: production-localization-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Localization audit and TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:3001

      - name: Remove temporary localization machinery
        run: |
          rm -f .github/workflows/production-localization-gate.yml
          rm -f .github/workflows/finalize-production-localization.yml
          rm -f .github/workflows/report-localization-errors.yml
          rm -f .github/workflows/capture-localization-ci.yml
          rm -f .github/workflows/cleanup-localization-diagnostics.yml
          rm -f .github/workflows/apply-approved-arabic-terms.yml
          rm -f .github/workflows/persist-oauth-locale.yml
          rm -f .github/workflows/fix-invite-production-copy.yml
          rm -f scripts/apply-approved-arabic-terms.mjs
          rm -f scripts/persist-oauth-locale.mjs
          rm -f scripts/fix-invite-production-copy.mjs
          rm -f frontend-ci-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize production Arabic localization" || true
          git push origin HEAD:${{ github.head_ref }}

      - name: Update pull request and mark ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/body.md <<'EOF'
          ## Summary

          Replaces the temporary DOM translation bridge with explicit, typed, production-ready English and natural Arabic localization across every platform-owned surface.

          ## Included

          - landing page and product demos
          - authentication and invitations
          - onboarding and website builder controls
          - Operations navigation and shell
          - calendar and appointment workflows
          - customers and clinical history
          - invoices, payment flows, and localized receipt requests
          - staff, services, settings, and owner analytics
          - loading, error, empty, modal, filter, tooltip, validation, and accessibility copy
          - locale-aware dates, times, numbers, and EGP values using Latin digits
          - responsive RTL behavior while keeping email, phone, URL, IDs, and technical values LTR
          - account-level language persistence through the backend preference endpoint
          - browser-language fallback when no preference or cookie exists

          ## Arabic voice

          Uses natural professional Arabic for Egyptian business software, translating the intended meaning rather than English sentence structure. Approved terminology includes `إدارة العمل`, `النشاط`, `فريق العمل`, `موعد`, `عميل`, `لوحة التحكم`, `نظام الإدارة`, `عدم حضور`, and `تحصيل الدفع`.

          ## Architecture

          - no runtime `MutationObserver` translation
          - no Arabic route prefixes
          - platform language remains separate from each business public-site language
          - custom public business websites and public booking remain controlled by `Business.language`
          - CI blocks untranslated platform copy, Arabic-Indic digits, and banned literal translations

          ## Verification

          - localization audit: passed
          - TypeScript: passed
          - ESLint: passed
          - production build: passed
          EOF
          gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file /tmp/body.md
          gh pr ready "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" || true
