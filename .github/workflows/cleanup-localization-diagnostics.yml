name: Clean localization diagnostics

on:
  push:
    branches: [fix/production-arabic-localization]
    paths:
      - frontend-ci-diagnostics.txt

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-arabic-localization
          fetch-depth: 0
      - name: Remove temporary diagnostics after a clean typecheck
        shell: bash
        run: |
          if ! grep -q '^EXIT_CODE=0$' frontend-ci-diagnostics.txt; then
            echo "Diagnostics still contain a failure."
            exit 0
          fi
          rm -f frontend-ci-diagnostics.txt
          rm -f .github/workflows/capture-localization-ci.yml
          rm -f .github/workflows/cleanup-localization-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary frontend diagnostics"
          git push origin HEAD:fix/production-arabic-localization
