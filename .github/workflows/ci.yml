name: Frontend CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log

      - name: Upload lint diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lint-diagnostics
          path: lint.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:3001

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-diagnostics
          path: build.log
          if-no-files-found: ignore
          retention-days: 3
