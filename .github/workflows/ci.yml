name: Frontend CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:3001

  align-onboarding-ui:
    name: Align onboarding UI with backend contract
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/oauth-session-callback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply deterministic UI alignment
        run: |
          python - <<'PY'
          from pathlib import Path

          customize_path = Path("src/modules/wizard/components/StepCustomizePreview.tsx")
          customize = customize_path.read_text()
          replacements = [
              (
                  '<div className="onboarding-field">\n              <label>{text("Hero introduction")}</label>',
                  '<div className="onboarding-field hidden">\n              <label>{text("Hero introduction")}</label>',
              ),
              (
                  '<div className="onboarding-field">\n              <label>{text("Hero image highlight")}</label>',
                  '<div className="onboarding-field hidden">\n              <label>{text("Hero image highlight")}</label>',
              ),
              (
                  '<label className="flex items-center justify-between rounded-2xl border border-[var(--onboarding-border)] bg-[#fafaf8] p-4">\n              <span>\n                <strong className="block text-sm">{text("Show service prices")}</strong>',
                  '<label className="hidden items-center justify-between rounded-2xl border border-[var(--onboarding-border)] bg-[#fafaf8] p-4">\n              <span>\n                <strong className="block text-sm">{text("Show service prices")}</strong>',
              ),
          ]
          for old, new in replacements:
              if old not in customize:
                  raise SystemExit(f"Expected onboarding customization block not found: {old[:80]}")
              customize = customize.replace(old, new, 1)
          customize_path.write_text(customize)

          service_path = Path("src/modules/wizard/components/StepServiceStaff.tsx")
          service = service_path.read_text()
          service_replacements = [
              ('priceEgp: 0,', 'priceEgp: 1,'),
              ('min={0}\n                      step={10}\n                      value={service.priceEgp}', 'min={1}\n                      step={10}\n                      value={service.priceEgp}'),
              ('priceEgp: Math.max(\n                            0,\n                            Number(event.target.value) || 0,', 'priceEgp: Math.max(\n                            1,\n                            Number(event.target.value) || 1,'),
              ('member.role !== text("Receptionist")', 'member.role !== "Receptionist"'),
              ('const isReceptionist = member.role === text("Receptionist");', 'const isReceptionist = member.role === "Receptionist";'),
          ]
          for old, new in service_replacements:
              if old not in service:
                  raise SystemExit(f"Expected service/team block not found: {old[:80]}")
              service = service.replace(old, new, 1)
          service_path.write_text(service)
          PY

      - name: Commit UI alignment
        run: |
          if git diff --quiet -- src/modules/wizard/components/StepCustomizePreview.tsx src/modules/wizard/components/StepServiceStaff.tsx; then
            echo "Onboarding UI already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/wizard/components/StepCustomizePreview.tsx src/modules/wizard/components/StepServiceStaff.tsx
          git commit -m "fix: align onboarding controls with backend contract"
          git push origin HEAD:${{ github.head_ref }}
