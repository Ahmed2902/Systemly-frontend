name: Capture localization CI diagnostics

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - .github/workflows/capture-localization-ci.yml
      - src/**
      - scripts/check-platform-localization-v2.mjs
      - package.json

permissions:
  contents: write

concurrency:
  group: capture-localization-ci
  cancel-in-progress: false

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture localization and TypeScript output
        shell: bash
        run: |
          set +e
          npm run typecheck > frontend-ci-diagnostics.txt 2>&1
          status=$?
          echo "EXIT_CODE=$status" >> frontend-ci-diagnostics.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontend-ci-diagnostics.txt
          git commit -m "chore: capture frontend CI diagnostics" || exit 0
          git push origin HEAD:${{ github.head_ref }}
