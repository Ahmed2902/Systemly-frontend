name: Add final UI labels

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - scripts/add-final-ui-labels.mjs
      - .github/workflows/add-final-ui-labels.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/add-final-ui-labels.mjs
      - name: Commit labels and remove one-time files
        run: |
          rm -f scripts/add-final-ui-labels.mjs
          rm -f .github/workflows/add-final-ui-labels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete Arabic accessibility labels" || exit 0
          git push origin HEAD:${{ github.head_ref }}
