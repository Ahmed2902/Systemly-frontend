name: Finalize production localization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - .github/workflows/finalize-production-localization.yml
      - src/**
      - scripts/check-platform-localization-v2.mjs
      - package.json
      - package-lock.json

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-production-localization
  cancel-in-progress: false

jobs:
  verify-and-finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Localization audit and TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:3001
      - name: Remove temporary migration and diagnostic files
        run: |
          rm -f .github/workflows/finalize-production-localization.yml
          rm -f .github/workflows/report-localization-errors.yml
          rm -f .github/workflows/capture-localization-ci.yml
          rm -f .github/workflows/cleanup-localization-diagnostics.yml
          rm -f .github/workflows/apply-approved-arabic-terms.yml
          rm -f scripts/apply-approved-arabic-terms.mjs
          rm -f frontend-ci-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize production localization" || true
          git push origin HEAD:${{ github.head_ref }}
      - name: Mark pull request ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
