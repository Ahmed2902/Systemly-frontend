name: Report localization errors

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - .github/workflows/report-localization-errors.yml
      - src/**
      - scripts/check-platform-localization-v2.mjs
      - package.json

permissions:
  contents: write
  pull-requests: write

jobs:
  report:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run typecheck
        id: check
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/frontend-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report failure
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Frontend localization CI diagnostics'
            echo
            echo '```text'
            tail -n 180 /tmp/frontend-check.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file /tmp/comment.md
      - name: Remove temporary diagnostic workflows after success
        if: steps.check.outputs.status == '0'
        run: |
          rm -f .github/workflows/report-localization-errors.yml
          rm -f .github/workflows/capture-localization-ci.yml
          rm -f .github/workflows/cleanup-localization-diagnostics.yml
          rm -f frontend-ci-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary localization diagnostics" || exit 0
          git push origin HEAD:${{ github.head_ref }}
