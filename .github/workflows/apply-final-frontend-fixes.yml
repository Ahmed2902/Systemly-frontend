name: Apply final frontend localization fixes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - scripts/apply-final-frontend-fixes.mjs
      - .github/workflows/apply-final-frontend-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-final-frontend-fixes.mjs
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: complete explicit platform translations"
          git push origin HEAD:${{ github.head_ref }}
